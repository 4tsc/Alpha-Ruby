<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .container {
            margin: 100px auto;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background-color: #1E1E1E;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #FFFFFF;
        }
        p {
            font-size: 14px;
            color: #AAAAAA;
            margin-bottom: 20px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        input {
            width: calc(100% - 40px);
            background-color: #262626;
            color: #FFFFFF;
            padding: 12px;
            border-radius: 8px 0 0 8px;
            border: 1px solid #444;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #007bff;
        }
        .toggle-password {
            width: 40px;
            background: none;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #444;
            border-left: none;
            border-radius: 0 8px 8px 0;
            height: 100%;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.2s;
        }
        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <header>MagicardUCT</header>
    <div class="container">
        <h1>Restablecer Contraseña</h1>
        <p>La contraseña debe tener al menos 8 caracteres.</p>
        <form id="resetPasswordForm">
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="Nueva Contraseña" minlength="8" required />
                <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">👁️</button>
            </div>
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirmar Nueva Contraseña" minlength="8" required />
                <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</button>
            </div>
            <button type="submit">Restablecer</button>
        </form>
    </div>

    <script>
        // Extraer el token de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            alert('Token no válido');
        }

        // Función para alternar visibilidad de la contraseña
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
            } else {
                field.type = 'password';
            }
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                alert('La contraseña debe tener al menos 8 caracteres.');
                return;
            }

            if (newPassword !== confirmPassword) {
                alert('Las contraseñas no coinciden.');
                return;
            }

            try {
                const response = await fetch('https://magicarduct.online:3000/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword }),
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Contraseña restablecida exitosamente');
                    window.location.href = '/'; // Redirigir al inicio
                } else {
                    alert(data.message || 'Error al restablecer contraseña');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al conectar con el servidor');
            }
        });
    </script>
</body>
</html>
